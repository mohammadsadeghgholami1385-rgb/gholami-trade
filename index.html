<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بازرگانی غلامی | GHOLAMI TRADE</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#202833;font-family:Tahoma,Arial}
header{background:#fff;text-align:center;padding:18px;border-bottom:4px solid #2769a8;color:#163e62}
header h1{margin:5px;font-size:24px}
header p{margin:5px;font-weight:bold}
nav{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;background:#fff;padding:10px}
button{border:0;border-radius:7px;background:#1769aa;color:#fff;padding:10px 13px;font-family:inherit;cursor:pointer;margin:3px}
button:hover{opacity:.86}
.danger{background:#bd3030}
.green{background:#17834a}
.gray{background:#666}
.orange{background:#b66b00}
input,select,textarea{width:100%;padding:10px;border:1px solid #ccd2da;border-radius:7px;font-family:inherit;margin:6px 0 12px}
main{max-width:1100px;margin:auto;padding:12px}
.page{display:none}
.page.active{display:block}
.card{background:white;border-radius:10px;padding:13px;margin:10px 0;box-shadow:0 2px 7px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.product img{width:100%;height:175px;object-fit:contain;background:#f5f6f8;border-radius:8px}
.price{color:#1769aa;font-weight:bold}
.old{color:#888;text-decoration:line-through;font-size:13px}
.tag{background:#c32d2d;color:#fff;border-radius:5px;padding:3px 6px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.small{font-size:13px;color:#666}
.hidden{display:none!important}
.status{background:#eee;padding:4px 7px;border-radius:5px;font-size:12px}
hr{border:0;border-top:1px solid #eee;margin:12px 0}
@media print{
nav,header,button{display:none!important}
body{background:#fff}
#invoice{display:block!important}
.page{display:none!important}
}
</style>
</head>

<body>

<header>
<h1>بازرگانی غلامی</h1>
<p>GHOLAMI TRADE</p>
<p>خرید آسان و مطمئن</p>
</header>

<nav>
<button data-page="shop">فروشگاه</button>
<button data-page="cart">سبد خرید</button>
<button data-page="favorites">علاقه‌مندی‌ها</button>
<button data-page="tracking">پیگیری سفارش</button>
<button data-page="admin">مدیریت</button>
</nav>

<main>

<section id="shop" class="page active">
<h2>فروشگاه</h2>
<input id="search" placeholder="جستجوی محصولات...">

<div class="row">
<select id="category">
<option value="">همه دسته‌ها</option>
</select>

<select id="sort">
<option value="">مرتب‌سازی</option>
<option value="cheap">ارزان‌ترین</option>
<option value="expensive">گران‌ترین</option>
</select>
</div>

<div id="products" class="grid"></div>
</section>

<section id="details" class="page">
<button data-page="shop">بازگشت به فروشگاه</button>
<div id="detailBox"></div>
</section>

<section id="cart" class="page">
<h2>سبد خرید</h2>
<div id="cartBox"></div>
<div id="cartSum" class="card"></div>

<div class="card">
<h3>اطلاعات خریدار</h3>
<input id="customer" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس">
<textarea id="address" placeholder="آدرس کامل"></textarea>
<button id="orderBtn" class="green">ثبت سفارش</button>
</div>
</section>

<section id="favorites" class="page">
<h2>علاقه‌مندی‌ها</h2>
<div id="favBox" class="grid"></div>
</section>

<section id="tracking" class="page">
<h2>پیگیری سفارش</h2>
<input id="trackCode" placeholder="کد سفارش">
<button id="trackBtn">پیگیری</button>
<div id="trackResult"></div>
</section>

<section id="invoice" class="page">
<h2>فاکتور</h2>
<div id="invoiceBox"></div>
<button onclick="window.print()">چاپ فاکتور</button>
<button data-page="shop">بازگشت به فروشگاه</button>
</section>

<section id="admin" class="page">

<div id="loginBox" class="card">
<h2>ورود مدیر</h2>
<input id="password" type="password" placeholder="رمز مدیریت">
<button id="login">ورود</button>
</div>

<div id="panel" class="hidden">

<div class="card">
<h2>ثبت / ویرایش محصول</h2>

<input id="editId" type="hidden">

<label>نام محصول</label>
<input id="name" placeholder="نام محصول">

<label>قیمت (تومان)</label>
<input id="price" type="number" min="0">

<label>درصد تخفیف</label>
<input id="discount" type="number" min="0" max="99" value="0">

<label>موجودی</label>
<input id="stock" type="number" min="0">

<label>دسته‌بندی</label>
<input id="cat" placeholder="مثلاً لوازم خانگی">

<label>توضیحات</label>
<textarea id="desc"></textarea>

<label>عکس محصول از گالری گوشی</label>
<input id="photo" type="file" accept="image/*">

<div id="previewWrap" class="hidden">
<img id="preview" style="display:block;max-width:100%;max-height:220px;margin:10px auto;object-fit:contain" alt="پیش‌نمایش تصویر">
<button id="clearPhoto" class="gray">پاک‌کردن تصویر انتخابی</button>
</div>

<button id="saveProduct" class="green">ذخیره محصول</button>
<button id="cancelEdit" class="gray">لغو و پاک‌کردن فرم</button>
</div>

<div class="card">
<h2>محصولات ثبت‌شده</h2>
<div id="manageProducts"></div>
</div>

<div class="card">
<h2>سفارش‌ها</h2>
<div id="manageOrders"></div>
</div>

<div class="card">
<h2>پشتیبان</h2>
<button id="export">دانلود پشتیبان</button>
<input type="file" id="backupFile" accept=".json">
<button id="import">بازیابی پشتیبان</button>
</div>

<button id="logout" class="danger">خروج از مدیریت</button>

</div>
</section>
</main>

<script>
'use strict';

const $=id=>document.getElementById(id);

function load(key,def){
 try{
  const v=JSON.parse(localStorage.getItem(key));
  return v===null?def:v;
 }catch{
  return def;
 }
}

let products=load('gt_products',[]);
let cart=load('gt_cart',[]);
let orders=load('gt_orders',[]);
let favorites=load('gt_favs',[]);
let admin=false;
let chosenImage=null;

function saveAll(){
 localStorage.setItem('gt_products',JSON.stringify(products));
 localStorage.setItem('gt_cart',JSON.stringify(cart));
 localStorage.setItem('gt_orders',JSON.stringify(orders));
 localStorage.setItem('gt_favs',JSON.stringify(favorites));
}

function safe(s){
 return String(s??'').replace(/[&<>"']/g,ch=>({
  '&':'&amp;',
  '<':'&lt;',
  '>':'&gt;',
  '"':'&quot;',
  "'":'&#39;'
 }[ch]));
}

function toman(n){
 return Number(n||0).toLocaleString('fa-IR')+' تومان';
}

function price(p){
 return Math.round(Number(p.price||0)*(100-(Number(p.discount)||0))/100);
}

function show(page){
 document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
 $(page)?.classList.add('active');

 if(page==='shop')drawProducts();
 if(page==='cart')drawCart();
 if(page==='favorites')drawFavs();
 if(page==='admin'&&admin)drawAdmin();
}

document.addEventListener('click',e=>{
 let nav=e.target.closest('[data-page]');
 if(nav){
  show(nav.dataset.page);
  return;
 }

 let b=e.target.closest('[data-do]');
 if(!b)return;

 const id=b.dataset.id;

 switch(b.dataset.do){
  case'add':addCart(id);break;
  case'fav':toggleFav(id);break;
  case'detail':details(id);break;
  case'plus':qty(id,1);break;
  case'minus':qty(id,-1);break;
  case'remove':
   cart=cart.filter(x=>x.id!==id);
   saveAll();
   drawCart();
   break;
  case'edit':editProduct(id);break;
  case'delete':deleteProduct(id);break;
  case'invoice':invoice(id);break;
  case'status':changeStatus(id,b.dataset.status);break;
  case'orderdel':deleteOrder(id);break;
 }
});

function drawProducts(){
 let list=products.slice();
 let q=$('search').value.trim().toLowerCase();
 let c=$('category').value;
 let sort=$('sort').value;

 list=list.filter(p=>
  (!q||(p.name+' '+(p.category||'')+' '+(p.description||'')).toLowerCase().includes(q))
  &&(!c||p.category===c)
 );

 if(sort==='cheap')list.sort((a,b)=>price(a)-price(b));
 if(sort==='expensive')list.sort((a,b)=>price(b)-price(a));

 let cats=[...new Set(products.map(p=>p.category).filter(Boolean))];

 $('category').innerHTML='<option value="">همه دسته‌ها</option>'+
 cats.map(x=>`<option>${safe(x)}</option>`).join('');

 $('category').value=c;

 $('products').innerHTML=list.map(p=>`
 <div class="card product">
 ${p.image
  ?`<img src="${p.image}" alt="${safe(p.name)}">`
  :`<div style="height:175px;background:#f5f5f5;border-radius:8px;display:grid;place-items:center">بدون تصویر</div>`}

 <h3>${safe(p.name)}</h3>
 <p>${safe(p.category||'')}</p>

 ${p.discount
  ?`<span class="old">${toman(p.price)}</span>
    <span class="tag">${p.discount}٪ تخفیف</span>`
  :''}

 <p class="price">${toman(price(p))}</p>
 <p>موجودی: ${Number(p.stock).toLocaleString('fa-IR')}</p>

 <button data-do="detail" data-id="${safe(p.id)}">جزئیات</button>
 <button data-do="add" data-id="${safe(p.id)}">افزودن به سبد</button>
 <button data-do="fav" data-id="${safe(p.id)}">${favorites.includes(p.id)?'★':'☆'} پسندیدن</button>
 </div>
 `).join('')||'<p class="card">محصولی یافت نشد.</p>';
}

$('search').addEventListener('input',drawProducts);
$('category').addEventListener('change',drawProducts);
$('sort').addEventListener('change',drawProducts);

function addCart(id){
 let p=products.find(x=>x.id===id);
 if(!p)return;

 if(p.stock<=0){
  alert('این محصول موجود نیست');
  return;
 }

 let i=cart.find(x=>x.id===id);

 if(i){
  if(i.qty>=p.stock){
   alert('بیشتر از موجودی نمی‌توانید انتخاب کنید');
   return;
  }
  i.qty++;
 }else{
  cart.push({id,qty:1});
 }

 saveAll();
 alert('به سبد خرید اضافه شد');
}

function qty(id,d){
 let item=cart.find(x=>x.id===id);
 let p=products.find(x=>x.id===id);
 if(!item)return;

 item.qty+=d;

 if(item.qty<=0){
  cart=cart.filter(x=>x.id!==id);
 }

 if(p&&item.qty>p.stock){
  item.qty=p.stock;
  alert('موجودی محدود است');
 }

 saveAll();
 drawCart();
}

function drawCart(){
 let html=cart.map(i=>{
  let p=products.find(x=>x.id===i.id);
  if(!p)return '';

  return `
  <div class="card">
  <b>${safe(p.name)}</b>
  <p>${toman(price(p))} | تعداد: ${i.qty}</p>
  <button data-do="minus" data-id="${i.id}">−</button>
  <button data-do="plus" data-id="${i.id}">+</button>
  <button class="danger" data-do="remove" data-id="${i.id}">حذف</button>
  </div>`;
 }).join('');

 $('cartBox').innerHTML=html||'<p class="card">سبد خرید خالی است.</p>';

 let sum=cart.reduce((s,i)=>{
  let p=products.find(x=>x.id===i.id);
  return s+(p?price(p)*i.qty:0);
 },0);

 $('cartSum').innerHTML=`<h3>جمع کل: ${toman(sum)}</h3>`;
}

function toggleFav(id){
 favorites.includes(id)
  ?favorites=favorites.filter(x=>x!==id)
  :favorites.push(id);

 saveAll();
 drawProducts();
 drawFavs();
}

function drawFavs(){
 $('favBox').innerHTML=favorites.map(id=>{
  let p=products.find(x=>x.id===id);

  return p?`
  <div class="card">
  <b>${safe(p.name)}</b>
  <p class="price">${toman(price(p))}</p>
  <button data-do="add" data-id="${id}">افزودن به سبد</button>
  <button data-do="fav" data-id="${id}">حذف از علاقه‌مندی</button>
  </div>`:'';
 }).join('')||'<p>موردی ذخیره نشده است.</p>';
}

function details(id){
 let p=products.find(x=>x.id===id);
 if(!p)return;

 $('detailBox').innerHTML=`
 <div class="card">
 ${p.image?`<img src="${p.image}" alt="${safe(p.name)}" style="max-width:100%;max-height:300px;display:block;margin:auto">`:''}
 <h2>${safe(p.name)}</h2>
 <p>${safe(p.category||'')}</p>
 <p>${safe(p.description||'')}</p>
 <p class="price">${toman(price(p))}</p>
 <p>موجودی: ${p.stock}</p>
 <button data-do="add" data-id="${id}">افزودن به سبد</button>
 <button data-do="fav" data-id="${id}">افزودن به علاقه‌مندی</button>
 </div>`;

 show('details');
}

$('orderBtn').addEventListener('click',()=>{
 if(!cart.length){
  alert('سبد خرید خالی است');
  return;
 }

 let name=$('customer').value.trim();
 let phone=$('phone').value.trim();
 let address=$('address').value.trim();

 if(!name||!phone||!address){
  alert('نام، شماره تماس و آدرس را وارد کنید');
  return;
 }

 for(let i of cart){
  let p=products.find(x=>x.id===i.id);
  if(!p||p.stock<i.qty){
   alert('موجودی یکی از محصولات کافی نیست');
   return;
  }
 }

 let items=cart.map(i=>{
  let p=products.find(x=>x.id===i.id);
  return{name:p.name,unit:price(p),qty:i.qty};
 });

 let total=items.reduce((s,i)=>s+i.unit*i.qty,0);
 let id='GT-'+Date.now().toString().slice(-8);

 let o={
  id,name,phone,address,items,total,
  status:'در انتظار ارسال',
  date:new Date().toLocaleString('fa-IR'),
  timestamp:Date.now()
 };

 orders.push(o);

 cart.forEach(i=>{
  let p=products.find(x=>x.id===i.id);
  if(p)p.stock-=i.qty;
 });

 cart=[];
 saveAll();

 $('customer').value='';
 $('phone').value='';
 $('address').value='';

 invoice(id);
});

function invoice(id){
 let o=orders.find(x=>x.id===id);
 if(!o)return;

 $('invoiceBox').innerHTML=`
 <div class="card">
 <h3>بازرگانی غلامی | GHOLAMI TRADE</h3>
 <p>شماره سفارش: <b>${safe(o.id)}</b></p>
 <p>تاریخ: ${safe(o.date)}</p>
 <p>نام خریدار: ${safe(o.name)}</p>
 <p>تماس: ${safe(o.phone)}</p>
 <p>آدرس: ${safe(o.address)}</p>
 <hr>
 ${o.items.map(i=>`
 <p>${safe(i.name)} | ${i.qty} × ${toman(i.unit)} = ${toman(i.qty*i.unit)}</p>
 `).join('')}
 <h3>مبلغ نهایی: ${toman(o.total)}</h3>
 <p>وضعیت: ${safe(o.status)}</p>
 </div>`;

 show('invoice');
}

$('trackBtn').addEventListener('click',()=>{
 let id=$('trackCode').value.trim();
 let o=orders.find(x=>x.id===id);

 $('trackResult').innerHTML=o
 ?`<div class="card">
 <p>سفارش: <b>${safe(o.id)}</b></p>
 <p>خریدار: ${safe(o.name)}</p>
 <p>وضعیت: <span class="status">${safe(o.status)}</span></p>
 <p>مبلغ: ${toman(o.total)}</p>
 </div>`
 :'<p class="card">سفارشی با این کد پیدا نشد.</p>';
});

$('login').addEventListener('click',()=>{
 if($('password').value==='2468'){
  admin=true;
  $('loginBox').classList.add('hidden');
  $('panel').classList.remove('hidden');
  drawAdmin();
 }else{
  alert('رمز نادرست است');
 }
});

$('logout').addEventListener('click',()=>{
 admin=false;
 $('panel').classList.add('hidden');
 $('loginBox').classList.remove('hidden');
 $('password').value='';
 show('shop');
});

$('photo').addEventListener('change',()=>{
 let f=$('photo').files[0];
 chosenImage=null;

 if(!f){
  $('previewWrap').classList.add('hidden');
  return;
 }

 if(!f.type.startsWith('image/')){
  alert('لطفاً تصویر انتخاب کنید');
  $('photo').value='';
  return;
 }

 if(f.size>8*1024*1024){
  alert('حجم عکس باید کمتر از ۸ مگابایت باشد');
  $('photo').value='';
  return;
 }

 let r=new FileReader();

 r.onload=()=>{
  $('preview').src=r.result;
  $('previewWrap').classList.remove('hidden');
 };

 r.readAsDataURL(f);
});

$('clearPhoto').addEventListener('click',()=>{
 $('photo').value='';
 chosenImage=null;
 $('preview').removeAttribute('src');
 $('previewWrap').classList.add('hidden');
});

function compressImage(file,cb){
 let r=new FileReader();

 r.onerror=()=>cb(null);

 r.onload=()=>{
  let im=new Image();

  im.onerror=()=>cb(null);

  im.onload=()=>{
   let max=900;
   let scale=Math.min(1,max/Math.max(im.width,im.height));
   let w=Math.max(1,Math.round(im.width*scale));
   let h=Math.max(1,Math.round(im.height*scale));
   let c=document.createElement('canvas');

   c.width=w;
   c.height=h;
   c.getContext('2d').drawImage(im,0,0,w,h);

   let out=c.toDataURL('image/jpeg',.78);
   if(out.length>1200000)out=c.toDataURL('image/jpeg',.58);

   cb(out);
  };

  im.src=r.result;
 };

 r.readAsDataURL(file);
}

function resetForm(){
 ['editId','name','price','stock','cat','desc'].forEach(x=>$(x).value='');
 $('discount').value='0';
 $('photo').value='';
 $('preview').removeAttribute('src');
 $('previewWrap').classList.add('hidden');
 chosenImage=null;
}

$('cancelEdit').addEventListener('click',resetForm);

$('saveProduct').addEventListener('click',()=>{
 let id=$('editId').value;
 let name=$('name').value.trim();
 let priceVal=Number($('price').value);
 let discount=Number($('discount').value)||0;
 let stock=Number($('stock').value);
 let category=$('cat').value.trim();
 let description=$('desc').value.trim();
 let file=$('photo').files[0];
 let old=products.find(x=>x.id===id);

 if(!name||!Number.isFinite(priceVal)||priceVal<0||!Number.isFinite(stock)||stock<0){
  alert('نام، قیمت و موجودی را درست وارد کنید');
  return;
 }

 if(discount<0||discount>99){
  alert('تخفیف باید بین صفر تا ۹۹ باشد');
  return;
 }

 function finish(img){
  let obj={
   id:id||String(Date.now()),
   name,price:priceVal,discount,stock,category,description,
   image:img||old?.image||''
  };

  if(old){
   products=products.map(p=>p.id===id?obj:p);
  }else{
   products.push(obj);
  }

  saveAll();
  resetForm();
  drawAdmin();
  drawProducts();
  alert('محصول ذخیره شد');
 }

 if(file){
  compressImage(file,img=>{
   if(!img){
    alert('پردازش تصویر ناموفق بود');
    return;
   }
   finish(img);
  });
 }else{
  finish(old?.image||'');
 }
});

function editProduct(id){
 let p=products.find(x=>x.id===id);
 if(!p)return;

 $('editId').value=p.id;
 $('name').value=p.name;
 $('price').value=p.price;
 $('discount').value=p.discount||0;
 $('stock').value=p.stock;
 $('cat').value=p.category||'';
 $('desc').value=p.description||'';

 if(p.image){
  $('preview').src=p.image;
  $('previewWrap').classList.remove('hidden');
 }

 show('admin');
 window.scrollTo(0,0);
}

function deleteProduct(id){
 if(!confirm('محصول حذف شود؟'))return;

 products=products.filter(p=>p.id!==id);
 cart=cart.filter(x=>x.id!==id);
 favorites=favorites.filter(x=>x!==id);

 saveAll();
 drawAdmin();
 drawProducts();
}

function drawAdmin(){
 $('manageProducts').innerHTML=products.map(p=>`
 <div class="card">
 <b>${safe(p.name)}</b>
 <p>${toman(price(p))} | موجودی ${p.stock}</p>
 <button data-do="edit" data-id="${p.id}">ویرایش</button>
 <button class="danger" data-do="delete" data-id="${p.id}">حذف</button>
 </div>
 `).join('')||'محصولی ثبت نشده';

 $('manageOrders').innerHTML=orders.slice().reverse().map(o=>`
 <div class="card">
 <b>${safe(o.id)}</b>
 <p>${safe(o.name)} | ${toman(o.total)}</p>
 <p>وضعیت: ${safe(o.status)}</p>
 <button data-do="invoice" data-id="${o.id}">فاکتور</button>
 <button data-do="status" data-status="در حال آماده‌سازی" data-id="${o.id}">آماده‌سازی</button>
 <button data-do="status" data-status="ارسال شده" data-id="${o.id}">ارسال شد</button>
 <button data-do="status" data-status="تحویل شده" data-id="${o.id}">تحویل شد</button>

function changeStatus(id,status){
 let o=orders.find(x=>x.id===id);
 if(o){
  o.status=status;
  saveAll();
  drawAdmin();
 }
}

function deleteOrder(id){
 if(!confirm('سفارش حذف شود؟'))return;
 orders=orders.filter(x=>x.id!==id);
 saveAll();
 drawAdmin();
}

$('export').addEventListener('click',()=>{
 let data={products,cart,orders,favorites};
 let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
 let url=URL.createObjectURL(blob);
 let a=document.createElement('a');
 a.href=url;
 a.download='gholami-trade-backup.json';
 a.click();
 URL.revokeObjectURL(url);
});

$('import').addEventListener('click',()=>{
 let f=$('backupFile').files[0];

 if(!f){
  alert('فایل پشتیبان را انتخاب کنید');
  return;
 }

 let r=new FileReader();

 r.onload=()=>{
  try{
   let d=JSON.parse(r.result);

   if(Array.isArray(d.products))products=d.products;
   if(Array.isArray(d.cart))cart=d.cart;
   if(Array.isArray(d.orders))orders=d.orders;
   if(Array.isArray(d.favorites))favorites=d.favorites;

   saveAll();
   drawAdmin();
   drawProducts();
   alert('پشتیبان بازیابی شد');
  }catch{
   alert('فایل پشتیبان معتبر نیست');
  }
 };

 r.readAsText(f);
});

drawProducts();
drawCart();

</script>
