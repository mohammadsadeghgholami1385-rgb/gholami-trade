
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بازرگانی غلامی | Gholami Trade</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#172c48;font-family:Tahoma,Arial}
header{background:#102f50;color:white;text-align:center;padding:22px 12px}
.logo{width:90px;height:90px;margin:auto;background:white;border-radius:15px;padding:5px}
h1{margin:12px 0 5px;font-size:25px}
header p{margin:5px;color:#d5e7ff}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;background:#fff;padding:12px;position:sticky;top:0}
button{border:0;border-radius:8px;background:#1e65a8;color:white;padding:11px 14px;font-family:inherit;cursor:pointer}
button:active{opacity:.7}
main{max-width:950px;margin:auto;padding:14px}
.card{background:white;padding:15px;border-radius:12px;margin:12px 0;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;border:1px solid #ccd5e1;border-radius:8px;font-family:inherit;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.product{background:white;padding:12px;border-radius:10px}
.product h3{font-size:16px}
.price{font-weight:bold;color:#1768ad}
.hidden{display:none}
.green{background:#16844b}
.red{background:#c0392b}
footer{text-align:center;padding:25px;background:#102f50;color:white;margin-top:30px}
</style>
</head>
<body>

<header>
<div class="logo">
<svg viewBox="0 0 100 100" width="100%" height="100%">
<path d="M50 5 L94 50 L80 64 L50 34 L20 64 L6 50 Z" fill="#12395f"/>
<path d="M22 56 L22 90 L36 90 L36 68 Z" fill="#5688c5"/>
<path d="M42 42 L42 90 L56 90 L56 42 Z" fill="#12395f"/>
<circle cx="69" cy="47" r="9" fill="#5688c5"/>
<path d="M64 60 L90 36 L90 50 L64 76 Z" fill="#5688c5"/>
</svg>
</div>
<h1>بازرگانی غلامی</h1>
<p>GHOLAMI TRADE</p>
<p>خرید آسان و ارتباط مستقیم با ما</p>
</header>

<nav>
<button onclick="show('shop')">فروشگاه</button>
<button onclick="show('cart')">سبد خرید 🛒</button>
<button onclick="show('admin')">مدیریت</button>
</nav>

<main>
<section id="shop">
<h2>محصولات فروشگاه</h2>
<input id="search" placeholder="جستجوی محصول..." oninput="render()">
<div id="products" class="grid"></div>
</section>

<section id="cart" class="hidden">
<h2>سبد خرید</h2>
<div id="cartItems"></div>
<div class="card">
<h3>اطلاعات خریدار</h3>
<input id="buyer" placeholder="نام و نام خانوادگی">
<input id="phone" placeholder="شماره تماس مشتری">
<textarea id="address" placeholder="آدرس کامل تحویل"></textarea>
<button class="green" onclick="checkout()">ثبت و ارسال سفارش واتساپی</button>
</div>
</section>

<section id="admin" class="hidden">
<div class="card">
<h2>مدیریت محصولات</h2>
<p>رمز مدیریت اولیه: 2468</p>
<input id="pass" type="password" placeholder="رمز مدیریت">
<button onclick="login()">ورود</button>
<div id="adminPanel" class="hidden">
<hr>
<input id="pname" placeholder="نام محصول">
<input id="pprice" type="number" placeholder="قیمت (تومان)">
<input id="pstock" type="number" placeholder="موجودی">
<input id="pimage" placeholder="لینک عکس محصول (اختیاری)">
<textarea id="pdesc" placeholder="توضیحات محصول"></textarea>
<button class="green" onclick="addProduct()">افزودن محصول</button>
<div id="adminProducts"></div>
</div>
</div>
</section>
</main>

<footer>
<strong>بازرگانی غلامی | GHOLAMI TRADE</strong>
<p>جهت ثبت سفارش و مشاوره با ما در ارتباط باشید</p>
</footer>

<script>
const WA="989159309226";
let products=JSON.parse(localStorage.getItem("gt_products")||"[]");
let cart=JSON.parse(localStorage.getItem("gt_cart")||"[]");

function save(){
 localStorage.setItem("gt_products",JSON.stringify(products));
 localStorage.setItem("gt_cart",JSON.stringify(cart));
}
function esc(s){
 return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function show(id){
 document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 if(id==="cart")renderCart();
 if(id==="admin"&&document.getElementById("adminPanel").classList.contains("hidden")){}
}
function render(){
 let q=document.getElementById("search").value.trim();
 let list=products.filter(p=>p.name.includes(q));
 document.getElementById("products").innerHTML=list.map(p=>`
 <div class="product">
 ${p.image?`<img src="${esc(p.image)}" style="width:100%;height:130px;object-fit:contain">`:""}
 <h3>${esc(p.name)}</h3>
 <p class="price">${Number(p.price).toLocaleString("fa-IR")} تومان</p>
 <p>${esc(p.desc)}</p>
 <p>موجودی: ${p.stock}</p>
 <button onclick="addCart('${p.id}')">افزودن به سبد</button>
 </div>`).join("")||"هنوز محصولی ثبت نشده است." ;
}
function addCart(id){
 let p=products.find(x=>x.id===id);
 if(!p||p.stock<=0){alert("این محصول موجود نیست");return}
 let item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({id,qty:1});
 save();alert("به سبد خرید اضافه شد");
}
function renderCart(){
 let out=document.getElementById("cartItems");
 if(!cart.length){out.innerHTML="سبد خرید خالی است.";return}
 let total=0;
 out.innerHTML=cart.map(i=>{
 let p=products.find(x=>x.id===i.id);
 if(!p)return "";
 let sum=p.price*i.qty;total+=sum;
 return `<div class="card"><b>${esc(p.name)}</b>
 <p>${Number(p.price).toLocaleString("fa-IR")} تومان</p>
 تعداد: ${i.qty}
 <button onclick="qty('${i.id}',1)">+</button>
 <button onclick="qty('${i.id}',-1)">-</button>
 <button class="red" onclick="removeItem('${i.id}')">حذف</button>
 <p>جمع: ${sum.toLocaleString("fa-IR")} تومان</p></div>`;
 }).join("")+`<h3>مجموع: ${total.toLocaleString("fa-IR")} تومان</h3>`;
}
function qty(id,n){
 let i=cart.find(x=>x.id===id);
 if(!i)return;
 i.qty+=n;
 if(i.qty<=0)cart=cart.filter(x=>x.id!==id);
 save();renderCart();
}
function removeItem(id){cart=cart.filter(x=>x.id!==id);save();renderCart()}
function checkout(){
 if(!cart.length){alert("سبد خرید خالی است");return}
 let name=document.getElementById("buyer").value.trim();
 let phone=document.getElementById("phone").value.trim();
 let address=document.getElementById("address").value.trim();
 if(!name||!phone||!address){alert("لطفاً نام، شماره تماس و آدرس را کامل وارد کنید");return}
 let lines=["*سفارش جدید - بازرگانی غلامی*","", "نام مشتری: "+name,"تماس: "+phone,"آدرس: "+address,"","*محصولات:*"];
 let total=0;
 cart.forEach(i=>{
  let p=products.find(x=>x.id===i.id);
  if(p){let sum=p.price*i.qty;total+=sum;lines.push(p.name+" | تعداد: "+i.qty+" | "+sum.toLocaleString("fa-IR")+" تومان")}
 });
 lines.push("","مجموع: "+total.toLocaleString("fa-IR")+" تومان");
 lines.push("","لطفاً سفارش را تأیید کنید.");
 let url="https://wa.me/"+WA+"?text="+encodeURIComponent(lines.join("\n"));
 window.open(url,"_blank");
}
function login(){
 if(document.getElementById("pass").value==="2468"){
  document.getElementById("adminPanel").classList.remove("hidden");
  renderAdmin();
 }else alert("رمز اشتباه است");
}
function addProduct(){
 let name=document.getElementById("pname").value.trim();
 let price=Number(document.getElementById("pprice").value);
 let stock=Number(document.getElementById("pstock").value);
 if(!name||price<0||!Number.isFinite(price)||stock<0){alert("نام، قیمت و موجودی را درست وارد کنید");return}
 products.push({id:String(Date.now()),name,price,stock,
 image:document.getElementById("pimage").value.trim(),
 desc:document.getElementById("pdesc").value.trim()});
 save();render();renderAdmin();
 document.getElementById("pname").value="";
 document.getElementById("pprice").value="";
 document.getElementById("pstock").value="";
 document.getElementById("pimage").value="";
 document.getElementById("pdesc").value="";
 alert("محصول اضافه شد");
}
function renderAdmin(){
 document.getElementById("adminProducts").innerHTML=products.map(p=>
 `<div class="card">${esc(p.name)} — ${Number(p.price).toLocaleString("fa-IR")} تومان
 <button class="red" onclick="delProduct('${p.id}')">حذف</button></div>`
 ).join("")||"محصولی ثبت نشده";
}
function delProduct(id){products=products.filter(p=>p.id!==id);cart=cart.filter(i=>i.id!==id);save();render();renderAdmin()}
render();
</script>
</body>
  </html>
